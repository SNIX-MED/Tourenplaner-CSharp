name: Build GAWELA universal configurator 6.4.11

on:
  push:
    branches: [gawela-colorconfig-6411-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout 6.4.11 branch
        uses: actions/checkout@v4

      - name: Checkout verified GAWELA 6.4.0 source chunks
        uses: actions/checkout@v4
        with:
          repository: SNIX-MED/Tourenplaner-CSharp
          ref: gawela-colorconfig-build
          path: legacy

      - name: Checkout Smartstore 6.4.0
        uses: actions/checkout@v4
        with:
          repository: smartstore/Smartstore
          ref: 6.4.0
          path: smartstore

      - name: Setup exact .NET SDK 10.0.302
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Build, package and verify 6.4.11
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('gawela6410/build.sh').read_text(encoding='utf-8')
          needle = 'python3 gawela6410/apply_patch.py smartstore/src/Smartstore.Modules/Gawela.ColorConfigurator\n'
          if needle not in src:
              raise SystemExit('6.4.10 patch insertion point missing')
          src = src.replace(needle, needle + 'python3 gawela6411/apply_patch.py smartstore/src/Smartstore.Modules/Gawela.ColorConfigurator\n', 1)
          src = src.replace('6.4.10', '6.4.11')
          verify = "grep -q 'Bildgruppe / Höhenvorlage' \"$MODULE/Views/GawelaColorAdmin/Configure.cshtml\"\n"
          extra = verify + "grep -q 'RAL-Farbkonfigurator für' \"$MODULE/Views/Shared/Components/GawelaColorSeo/Default.cshtml\"\ngrep -q 'productdetails_pictures_bottom' smartstore/src/Smartstore.Modules/Gawela.ColorConfigurator/Filters/GawelaProductDetailFilter.cs\n"
          if verify not in src:
              raise SystemExit('verification insertion point missing')
          src = src.replace(verify, extra, 1)
          src = src.replace('Attributgesteuerte dynamische RAL-Farbvorschau mit wiederverwendbaren Bildgruppen/Höhenvorlagen, zentral pflegbaren RGB/HEX-Werten und Smartstore-Galerie-Slide.', 'Attributgesteuerte dynamische RAL-Farbvorschau mit Bildgruppen/Höhenvorlagen, zentral pflegbaren RGB/HEX-Werten, Smartstore-Galerie-Slide sowie serverseitig lesbaren SEO/KI-Produktinformationen.')
          Path('/tmp/gawela6411-build.sh').write_text(src, encoding='utf-8')
          PY
          bash /tmp/gawela6411-build.sh

      - name: Upload installable module
        uses: actions/upload-artifact@v4
        with:
          name: Smartstore.Module.Gawela.ColorConfigurator.6.4.11
          path: Smartstore.Module.Gawela.ColorConfigurator.6.4.11.zip
          if-no-files-found: error
