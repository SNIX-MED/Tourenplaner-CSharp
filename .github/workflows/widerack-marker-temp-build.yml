name: widerack-marker-temp-build
on:
  push:
    branches: [ tmp-widerack-marker-6411 ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare WideRackConfig source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/widesrc
          cp -R .tmp-wide-marker-src/. /tmp/widesrc/
          test -f /tmp/widesrc/module.json
          test -f /tmp/widesrc/WideRackPlugin.cs
          test -f /tmp/widesrc/OffertSourceBadge.cs
          test -f /tmp/widesrc/OrderMessageSource.cs
      - name: Checkout Smartstore 6.4.0
        run: git clone --depth 1 --branch 6.4.0 https://github.com/smartstore/Smartstore.git /tmp/smartstore
      - name: Build plugin
        id: build
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          TARGET=/tmp/smartstore/src/Smartstore.Modules/Gawela.WideRackConfig
          mkdir -p "$TARGET"
          cp -R /tmp/widesrc/. "$TARGET"/
          dotnet build "$TARGET/Gawela.WideRackConfig.csproj" -c DebugNoRazorCompile -p:RazorCompileOnBuild=false -p:RazorCompileOnPublish=false 2>&1 | tee /tmp/widerack-marker-build.log
          CODE=${PIPESTATUS[0]}
          echo "$CODE" > /tmp/widerack-marker-build.exit
          if [ "$CODE" -eq 0 ]; then
            DLL=$(find "$TARGET/bin" -type f -name Gawela.WideRackConfig.dll | head -1)
            test -n "$DLL"
            mkdir -p /tmp/out
            cp "$DLL" /tmp/out/Gawela.WideRackConfig.dll
          fi
          exit "$CODE"
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widerack-marker-build-diagnostics
          path: |
            /tmp/widerack-marker-build.log
            /tmp/widerack-marker-build.exit
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: widerackconfig-6.4.11-dll
          path: /tmp/out/Gawela.WideRackConfig.dll
      - name: Fail if compilation failed
        if: steps.build.outcome != 'success'
        run: exit 1
