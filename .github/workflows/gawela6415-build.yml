name: Handoff GAWELA configurator 6.4.16 package

on:
  pull_request:
    branches: [gawela-colorconfig-6416-artifact-base]

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Verify installable package
        shell: bash
        run: |
          test -s gawela6416/output/Smartstore.Module.Gawela.ColorConfigurator.6.4.16.zip
          unzip -t gawela6416/output/Smartstore.Module.Gawela.ColorConfigurator.6.4.16.zip
          echo "9e50f301417d869770f3159ed4dca6c2302a06b0fc554169ce6fcfb5bd7cc3b9  gawela6416/output/Smartstore.Module.Gawela.ColorConfigurator.6.4.16.zip" | sha256sum -c -

      - name: Upload installable module
        uses: actions/upload-artifact@v4
        with:
          name: Smartstore.Module.Gawela.ColorConfigurator.6.4.16
          path: gawela6416/output/Smartstore.Module.Gawela.ColorConfigurator.6.4.16.zip
          if-no-files-found: error
