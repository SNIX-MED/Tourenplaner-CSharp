name: Export GAWELA configurator 6.4.16 package

on:
  push:
    branches: [gawela-colorconfig-6416-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Export package as text chunks
        shell: bash
        run: |
          test -s gawela6416/output/Smartstore.Module.Gawela.ColorConfigurator.6.4.16.zip
          rm -rf gawela6416/export
          mkdir -p gawela6416/export
          base64 -w0 gawela6416/output/Smartstore.Module.Gawela.ColorConfigurator.6.4.16.zip > /tmp/gawela6416.b64
          split -b 20000 -d -a 2 /tmp/gawela6416.b64 gawela6416/export/part
          printf '%s\n' 'Concatenate part00..partNN and Base64-decode to restore Smartstore.Module.Gawela.ColorConfigurator.6.4.16.zip.' > gawela6416/export/README.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gawela6416/export
          git commit -m "Export 6.4.16 package chunks [skip ci]"
          git push origin HEAD:gawela-colorconfig-6416-build
