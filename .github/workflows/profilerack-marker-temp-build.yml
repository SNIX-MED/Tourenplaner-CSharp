name: profilerack-marker-temp-build
on:
  push:
    branches: [ tmp-profilerack-marker-641 ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare ProfileRackConfig source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/profilesrc
          cp -R .tmp-profile-marker-src/. /tmp/profilesrc/
          test -f /tmp/profilesrc/module.json
          test -f /tmp/profilesrc/ProfileRackPlugin.cs
          test -f /tmp/profilesrc/OffertSourceBadge.cs
          test -f /tmp/profilesrc/OrderMessageSource.cs
      - name: Checkout Smartstore 6.4.0
        run: git clone --depth 1 --branch 6.4.0 https://github.com/smartstore/Smartstore.git /tmp/smartstore
      - name: Build plugin
        id: build
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          TARGET=/tmp/smartstore/src/Smartstore.Modules/Gawela.ProfileRackConfig
          mkdir -p "$TARGET"
          cp -R /tmp/profilesrc/. "$TARGET"/
          dotnet build "$TARGET/Gawela.ProfileRackConfig.csproj" -c DebugNoRazorCompile -p:RazorCompileOnBuild=false -p:RazorCompileOnPublish=false 2>&1 | tee /tmp/profilerack-build.log
          CODE=${PIPESTATUS[0]}
          echo "$CODE" > /tmp/profilerack-build.exit
          if [ "$CODE" -eq 0 ]; then
            DLL=$(find "$TARGET/bin" -type f -name Gawela.ProfileRackConfig.dll | head -1)
            test -n "$DLL"
            mkdir -p /tmp/out
            cp "$DLL" /tmp/out/Gawela.ProfileRackConfig.dll
          fi
          exit "$CODE"
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profilerack-build-diagnostics
          path: |
            /tmp/profilerack-build.log
            /tmp/profilerack-build.exit
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: profilerackconfig-6.4.1-dll
          path: /tmp/out/Gawela.ProfileRackConfig.dll
      - name: Fail if compilation failed
        if: steps.build.outcome != 'success'
        run: exit 1
