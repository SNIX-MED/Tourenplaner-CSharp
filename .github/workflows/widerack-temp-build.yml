name: widerack-temp-build
on:
  push:
    branches: [ tmp-widerack-build ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore source payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wideracksrc
          cat .tmp-widerack/payload.part.* | base64 -d > /tmp/wideracksrc/source.tar.gz
          tar -xzf /tmp/wideracksrc/source.tar.gz -C /tmp/wideracksrc
          rm -f /tmp/wideracksrc/source.tar.gz
      - name: Checkout Smartstore 6.4.0
        run: git clone --depth 1 --branch 6.4.0 https://github.com/smartstore/Smartstore.git /tmp/smartstore
      - name: Build plugin
        id: build
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          TARGET=/tmp/smartstore/src/Smartstore.Modules/Gawela.WideRackConfig
          mkdir -p "$TARGET"
          cp -R /tmp/wideracksrc/* "$TARGET"/
          cat > "$TARGET/module.json" <<'JSON'
          {"$schema":"../module.schema.json","Author":"GAWELA GmbH","Group":"CMS","SystemName":"Gawela.WideRackConfig","FriendlyName":"GAWELA Weitspannregal-Konfigurator","Description":"Weitspannregal-Konfigurator für Smartstore 6.4","Version":"6.4.1","MinAppVersion":"6.4.0","Order":101,"ResourceRootKey":"Plugins.Gawela.WideRackConfig"}
          JSON
          dotnet build "$TARGET/Gawela.WideRackConfig.csproj" -c DebugNoRazorCompile -p:RazorCompileOnBuild=false -p:RazorCompileOnPublish=false 2>&1 | tee /tmp/widerack-build.log
          CODE=${PIPESTATUS[0]}
          echo "$CODE" > /tmp/widerack-build.exit
          if [ "$CODE" -eq 0 ]; then
            DLL=$(find "$TARGET/bin" -type f -name Gawela.WideRackConfig.dll | head -1)
            test -n "$DLL"
            mkdir -p /tmp/out
            cp "$DLL" /tmp/out/Gawela.WideRackConfig.dll
          fi
          exit "$CODE"
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widerack-build-diagnostics
          path: |
            /tmp/widerack-build.log
            /tmp/widerack-build.exit
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: widerack-6.4.1-dll
          path: /tmp/out/Gawela.WideRackConfig.dll
      - name: Fail if compilation failed
        if: steps.build.outcome != 'success'
        run: exit 1
