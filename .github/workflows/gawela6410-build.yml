name: Build GAWELA universal configurator 6.4.10

on:
  push:
    branches: [gawela-colorconfig-6410-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout 6.4.10 branch
        uses: actions/checkout@v4

      - name: Checkout verified GAWELA 6.4.0 source chunks
        uses: actions/checkout@v4
        with:
          repository: SNIX-MED/Tourenplaner-CSharp
          ref: gawela-colorconfig-build
          path: legacy

      - name: Checkout Smartstore 6.4.0
        uses: actions/checkout@v4
        with:
          repository: smartstore/Smartstore
          ref: 6.4.0
          path: smartstore

      - name: Setup exact .NET SDK 10.0.302
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Build, package and verify 6.4.10
        shell: bash
        run: bash gawela6410/build.sh

      - name: Upload installable module
        uses: actions/upload-artifact@v4
        with:
          name: Smartstore.Module.Gawela.ColorConfigurator.6.4.10
          path: Smartstore.Module.Gawela.ColorConfigurator.6.4.10.zip
          if-no-files-found: error
