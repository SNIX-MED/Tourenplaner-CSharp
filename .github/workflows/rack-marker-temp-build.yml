name: rack-marker-temp-build
on:
  push:
    branches: [ tmp-rack-marker-642 ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore source payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/racksrc
          cat .tmp-rack-marker/payload.part.* | base64 -d > /tmp/racksrc/source.tar.gz
          tar -xzf /tmp/racksrc/source.tar.gz -C /tmp/racksrc
          rm -f /tmp/racksrc/source.tar.gz
      - name: Checkout Smartstore 6.4.0
        run: git clone --depth 1 --branch 6.4.0 https://github.com/smartstore/Smartstore.git /tmp/smartstore
      - name: Build plugin
        id: build
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          TARGET=/tmp/smartstore/src/Smartstore.Modules/Gawela.RackConfig
          mkdir -p "$TARGET"
          cp -R /tmp/racksrc/* "$TARGET"/
          dotnet build "$TARGET/Gawela.RackConfig.csproj" -c DebugNoRazorCompile -p:RazorCompileOnBuild=false -p:RazorCompileOnPublish=false 2>&1 | tee /tmp/rack-marker-build.log
          CODE=${PIPESTATUS[0]}
          echo "$CODE" > /tmp/rack-marker-build.exit
          if [ "$CODE" -eq 0 ]; then
            DLL=$(find "$TARGET/bin" -type f -name Gawela.RackConfig.dll | head -1)
            test -n "$DLL"
            mkdir -p /tmp/out
            cp "$DLL" /tmp/out/Gawela.RackConfig.dll
          fi
          exit "$CODE"
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rack-marker-build-diagnostics
          path: |
            /tmp/rack-marker-build.log
            /tmp/rack-marker-build.exit
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: rackconfig-6.4.42-dll
          path: /tmp/out/Gawela.RackConfig.dll
      - name: Fail if compilation failed
        if: steps.build.outcome != 'success'
        run: exit 1
