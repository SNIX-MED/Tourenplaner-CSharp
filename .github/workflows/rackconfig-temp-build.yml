name: rackconfig-temp-build
on:
  push:
    branches: [ tmp-rackconfig-decompile ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore source payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/racksrc
          cat .tmp-rack/payload.part.* | base64 -d > /tmp/racksrc/source.tar.gz
          tar -xzf /tmp/racksrc/source.tar.gz -C /tmp/racksrc
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/racksrc/Gawela.RackConfig.csproj')
          s = p.read_text()
          s = s.replace('<Nullable>enable</Nullable>', '<Nullable>enable</Nullable>\n    <ImplicitUsings>enable</ImplicitUsings>')
          s = s.replace('..\\Smartstore.Web\\Smartstore.Web.csproj', '..\\..\\Smartstore.Web\\Smartstore.Web.csproj')
          p.write_text(s)
          PY
      - name: Checkout Smartstore 6.4.0
        run: git clone --depth 1 --branch 6.4.0 https://github.com/smartstore/Smartstore.git /tmp/smartstore
      - name: Build plugin
        id: build
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          TARGET=/tmp/smartstore/src/Smartstore.Modules/Gawela.RackConfig
          mkdir -p "$TARGET"
          cp -R /tmp/racksrc/* "$TARGET"/
          rm -f "$TARGET/source.tar.gz"
          cat > "$TARGET/module.json" <<'JSON'
          {
            "$schema": "../module.schema.json",
            "Author": "GAWELA GmbH",
            "Group": "CMS",
            "SystemName": "Gawela.RackConfig",
            "FriendlyName": "GAWELA Palettenregal-Konfigurator",
            "Description": "Palettenregal-Konfigurator mit persistenten Einstellungen und OutputCache-Fix.",
            "Version": "6.4.32",
            "MinAppVersion": "6.4.0",
            "Order": 100,
            "ResourceRootKey": "Plugins.Gawela.RackConfig"
          }
          JSON
          dotnet build "$TARGET/Gawela.RackConfig.csproj" -c DebugNoRazorCompile -p:RazorCompileOnBuild=false -p:RazorCompileOnPublish=false 2>&1 | tee /tmp/build.log
          CODE=${PIPESTATUS[0]}
          echo "$CODE" > /tmp/build.exit
          if [ "$CODE" -eq 0 ]; then
            DLL=$(find "$TARGET/bin" -type f -name Gawela.RackConfig.dll | head -1)
            test -n "$DLL"
            mkdir -p /tmp/out
            cp "$DLL" /tmp/out/Gawela.RackConfig.dll
          fi
          exit "$CODE"
      - name: Upload build diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rackconfig-build-diagnostics
          path: |
            /tmp/build.log
            /tmp/build.exit
      - name: Upload compiled DLL
        uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: rackconfig-6.4.32-dll
          path: /tmp/out/Gawela.RackConfig.dll
      - name: Fail if compilation failed
        if: steps.build.outcome != 'success'
        run: exit 1
