name: rackconfig-temp-build
on:
  push:
    branches: [ tmp-rackconfig-decompile ]
permissions:
  contents: write
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore source payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/racksrc
          cat .tmp-rack/payload.part.* | base64 -d > /tmp/racksrc/source.tar.gz
          tar -xzf /tmp/racksrc/source.tar.gz -C /tmp/racksrc
      - name: Checkout Smartstore 6.4.0
        run: git clone --depth 1 --branch 6.4.0 https://github.com/smartstore/Smartstore.git /tmp/smartstore
      - name: Build plugin
        shell: bash
        run: |
          set -euo pipefail
          TARGET=/tmp/smartstore/src/Smartstore.Modules/Gawela.RackConfig
          mkdir -p "$TARGET"
          cp -R /tmp/racksrc/* "$TARGET"/
          rm -f "$TARGET/source.tar.gz"
          dotnet build "$TARGET/Gawela.RackConfig.csproj" -c DebugNoRazorCompile -p:RazorCompileOnBuild=false -p:RazorCompileOnPublish=false
          DLL=$(find "$TARGET/bin" -type f -name Gawela.RackConfig.dll | head -1)
          test -n "$DLL"
          base64 -w0 "$DLL" > .tmp-rack/result.dll.b64
      - name: Publish temporary result
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .tmp-rack/result.dll.b64
          git commit -m 'Temporary RackConfig build result [skip ci]'
          git push
