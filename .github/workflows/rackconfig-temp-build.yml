name: rackconfig-source-export
on:
  push:
    branches: [ tmp-rackconfig-decompile ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/racksrc
          cat .tmp-rack/payload.part.* | base64 -d > /tmp/racksrc/source.tar.gz
          tar -xzf /tmp/racksrc/source.tar.gz -C /tmp/racksrc
          rm -f /tmp/racksrc/source.tar.gz
          find /tmp/racksrc -maxdepth 3 -type f -print
      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: rackconfig-source-6.4.32
          path: /tmp/racksrc
