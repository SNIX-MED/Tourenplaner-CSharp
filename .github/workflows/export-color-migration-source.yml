name: Export ColorConfigurator migration source

on:
  pull_request:
    branches: [ main ]

permissions:
  actions: read
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout export branch
        uses: actions/checkout@v4
        with:
          ref: smartstore-migration-source
          fetch-depth: 0

      - name: Download verified ColorConfigurator artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/color-artifact /tmp/color-source .smartstore-export
          mkdir -p /tmp/color-artifact /tmp/color-source .smartstore-export
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/SNIX-MED/Tourenplaner-CSharp/actions/artifacts/9402147724/zip \
            -o /tmp/color-artifact/artifact.zip
          unzip -q /tmp/color-artifact/artifact.zip -d /tmp/color-artifact/unpacked
          SOURCE_ZIP=/tmp/color-artifact/unpacked/gawela6422/output/Gawela.ColorConfigurator.6.4.22-complete-source.zip
          test -s "$SOURCE_ZIP"
          unzip -q "$SOURCE_ZIP" -d /tmp/color-source
          test -s /tmp/color-source/Gawela.ColorConfigurator/module.json
          cp -a /tmp/color-source/Gawela.ColorConfigurator .smartstore-export/
          rm -rf .smartstore-export/Gawela.ColorConfigurator/bin .smartstore-export/Gawela.ColorConfigurator/obj

          ROOT=.smartstore-export/Gawela.ColorConfigurator
          grep -q '"Version": "6.4.23"' "$ROOT/module.json"
          grep -q 'ProductSummariesBySkus' "$ROOT/Controllers/GawelaColorAdminController.cs"
          echo '80490e3afbf173e368171603e843d20be7e3f13ee242d0f7e6e9648cf29a6e5e  '"$ROOT"'/Controllers/GawelaColorAdminController.cs' | sha256sum -c -
          echo '192cc8f58ac4c70e9554ea217b925d86d1d29d1f6941d0a1bb191f9e0aed1f90  '"$ROOT"'/Views/GawelaColorAdmin/Configure.cshtml' | sha256sum -c -
          echo 'd9482350059cdd6c6e79a2f5fc28295979a7621bd96648d69da4e0801e4e7f00  '"$ROOT"'/wwwroot/gawela-color.js' | sha256sum -c -

      - name: Commit temporary export and remove exporter
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/export-color-migration-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Temporary verified ColorConfigurator migration source'
          git push origin HEAD:smartstore-migration-source
